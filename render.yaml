services:
  - type: web
    name: kitob-dokoni-boti
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "python -m bot.main"
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kitob-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: kitob-db
    databaseName: kitobdb
    user: kitobuser
    plan: free
